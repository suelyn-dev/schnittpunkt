<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMDAgMTAwJz48Y2lyY2xlIGN4PSc1MCcgY3k9JzUwJyByPSc0NScgZmlsbD0nI2U2MDAwMCcvPjwvc3ZnPg==">

<body>
    <h1>Salon Schnittpunkt - Mitarbeiterbereich</h1>
    <p>Hier das Passwort eingeben:</p>
    <form action="#">
        <div class="passwort-behaelter">
            <input name="passwort" id="passwort" type="password" class="passwort-feld" placeholder="Passwort">
            <a role="button" class="passwort-button">
                <span class="passwort-anzeigen-icon">◉</span>
                <span class="passwort-verstecken-icon">⊘</span>
            </a>
        </div>
        <button type="submit">Einloggen</button>
    </form>
</body>

</html>
